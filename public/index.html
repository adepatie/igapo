<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Trail - 3D Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #game-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            padding: 20px;
        }
        
        #left-column {
            grid-column: 1;
            grid-row: 1;
            align-self: flex-start;
        }
        
        #right-column {
            grid-column: 3;
            grid-row: 1;
            align-self: flex-start;
            justify-self: flex-end;
        }

        #stats-panel {
            background: rgba(0, 20, 10, 0.85);
            border: 2px solid #2a5a3a;
            border-radius: 10px;
            padding: 15px 20px;
            color: #88ff88;
            font-size: 14px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            align-self: flex-start;
            max-width: 300px;
            pointer-events: auto;
            user-select: text;
        }

        .stat-line {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .stat-label {
            color: #66dd66;
            font-weight: bold;
        }

        .stat-value {
            color: #aaffaa;
        }

        #educational-panel {
            background: rgba(20, 40, 60, 0.92);
            border: 2px solid #6ac5d9;
            border-radius: 10px;
            padding: 15px;
            color: #e0f7ff;
            font-size: 14px;
            line-height: 1.5;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 25px rgba(106, 197, 217, 0.3);
            width: 320px;
            pointer-events: auto;
            user-select: text;
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        #educational-panel.visible {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        #educational-panel .animal-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 2px solid #4a9ab0;
            background: rgba(0, 0, 0, 0.3);
            display: block;
        }
        
        #educational-panel .animal-image.loading {
            opacity: 0.5;
        }
        
        #educational-panel .animal-image.error {
            height: 0;
            margin: 0;
            border: none;
        }

        #educational-panel .animal-name {
            font-size: 18px;
            font-weight: bold;
            color: #8fe5ff;
            margin-bottom: 4px;
        }
        
        #educational-panel .header-icon {
            font-size: 20px;
            margin-right: 8px;
        }

        #educational-panel .scientific-name {
            font-size: 12px;
            font-style: italic;
            color: #a0d0e0;
            margin-bottom: 10px;
        }

        #educational-panel .fact {
            font-size: 13px;
            color: #d0e8f0;
            line-height: 1.4;
        }

        #narrative-panel {
            background: rgba(10, 20, 30, 0.9);
            border: 2px solid #4a7a8a;
            border-radius: 10px;
            padding: 20px;
            color: #ccffff;
            font-size: 16px;
            line-height: 1.6;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            max-width: 800px;
            max-height: 40vh;
            overflow-y: auto;
            pointer-events: auto;
            user-select: text;
            cursor: text;
            grid-column: 2;
            grid-row: 2;
            align-self: center;
        }

        #narrative-panel::-webkit-scrollbar {
            width: 8px;
        }

        #narrative-panel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        #narrative-panel::-webkit-scrollbar-thumb {
            background: #4a7a8a;
            border-radius: 4px;
        }

        #actions-panel {
            background: rgba(20, 30, 20, 0.9);
            border: 2px solid #5a8a5a;
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            max-width: 600px;
            width: 100%;
            pointer-events: auto;
            grid-column: 2;
            grid-row: 3;
            align-self: flex-start;
            justify-self: center;
        }

        .action-button {
            display: block;
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            background: linear-gradient(135deg, #2a5a3a, #1a4a2a);
            color: #ccffcc;
            border: 2px solid #3a7a4a;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            pointer-events: auto;
        }

        .action-button:hover {
            background: linear-gradient(135deg, #3a7a5a, #2a6a4a);
            border-color: #4a9a6a;
            transform: translateX(5px);
            box-shadow: 0 2px 10px rgba(74, 154, 106, 0.4);
        }

        .action-button:active {
            transform: translateX(5px) scale(0.98);
        }

        .action-label {
            font-weight: bold;
            color: #88ff88;
        }

        .action-description {
            font-size: 12px;
            color: #aaddaa;
            margin-top: 4px;
        }

        #input-panel {
            background: rgba(20, 30, 40, 0.9);
            border: 2px solid #5a7a8a;
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            max-width: 600px;
            width: 100%;
            pointer-events: auto;
            display: none;
            grid-column: 2;
            grid-row: 2;
            align-self: center;
            justify-self: center;
        }

        #input-panel.visible {
            display: block;
        }

        #input-panel label {
            display: block;
            color: #aaddff;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #player-name-input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #4a7a8a;
            border-radius: 4px;
            color: #ccffff;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            margin-bottom: 10px;
            pointer-events: auto;
        }

        #start-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2a5a7a, #1a4a6a);
            color: #ccffff;
            border: 2px solid #3a7a9a;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        #start-button:hover {
            background: linear-gradient(135deg, #3a7a9a, #2a6a8a);
            border-color: #4a9aba;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #88ff88;
            font-size: 24px;
            z-index: 100;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(136, 255, 136, 0.3);
            border-top: 4px solid #88ff88;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Amazon Trail...</div>
    </div>

    <div id="game-ui" class="hidden">
        <div id="left-column">
            <div id="stats-panel">
                <div class="stat-line">
                    <span class="stat-label">Explorer:</span>
                    <span class="stat-value" id="player-name">—</span>
                </div>
                <div class="stat-line">
                    <span class="stat-label">Location:</span>
                    <span class="stat-value" id="location">—</span>
                </div>
                <div class="stat-line">
                    <span class="stat-label">Morale:</span>
                    <span class="stat-value" id="morale">—</span>
                </div>
                <div class="stat-line">
                    <span class="stat-label">Stamina:</span>
                    <span class="stat-value" id="stamina">—</span>
                </div>
                <div class="stat-line">
                    <span class="stat-label">Supplies:</span>
                    <span class="stat-value" id="supplies">—</span>
                </div>
                <div class="stat-line">
                    <span class="stat-label">Days:</span>
                    <span class="stat-value" id="days">—</span>
                </div>
            </div>
        </div>

        <div id="right-column">
            <div id="educational-panel">
                <div style="font-size: 16px; color: #6ac5d9; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid rgba(106, 197, 217, 0.3); padding-bottom: 8px;">
                    <span class="header-icon">📚</span>Amazon Wildlife
                </div>
                <img id="animal-image" class="animal-image" src="" alt="Animal photo" />
                <div class="animal-name" id="animal-name"></div>
                <div class="scientific-name" id="scientific-name"></div>
                <div class="fact" id="educational-fact"></div>
            </div>
        </div>

        <div id="narrative-panel"></div>

        <div id="input-panel">
            <label for="player-name-input">Enter your explorer name:</label>
            <input type="text" id="player-name-input" placeholder="Your name..." maxlength="30" />
            <button id="start-button">Begin Expedition</button>
        </div>

        <div id="actions-panel" class="hidden"></div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
